name: Firebase App Distribution (Production)

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod

jobs:
  build_and_distribute:
    name: Build and Distribute (Prod)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Increment Version in Pubspec
        id: get_version
        shell: pwsh
        run: |
          $content = Get-Content pubspec.yaml
          $line = $content | Select-String -Pattern "version: (.*)"
          $version = $line.Matches.Value.Split(" ")[1]
          $versionParts = $version.Split("+")
          $baseVersion = $versionParts[0]
          $buildNumber = [int]$versionParts[1] + 1
          $newVersion = "$baseVersion+$buildNumber"
          
          # Replace in file
          (Get-Content pubspec.yaml) -replace "version: .*", "version: $newVersion" | Set-Content pubspec.yaml
          
          echo "version=$baseVersion" >> $env:GITHUB_OUTPUT
          echo "build_number=$buildNumber" >> $env:GITHUB_OUTPUT
          echo "new_version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Commit version bump and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${{ steps.get_version.outputs.new_version }} [skip ci] [ci skip]"
          git tag "v${{ steps.get_version.outputs.version }}-${{ steps.get_version.outputs.build_number }}"
          git push
          git push origin "v${{ steps.get_version.outputs.version }}-${{ steps.get_version.outputs.build_number }}"

      - name: Create .env file
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL_PROD }}" > .env

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=.env

      - name: Upload artifact to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: "1:388970099836:android:1263d86df30286226745f9"
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: android
          file: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          tag_name: "v${{ steps.get_version.outputs.version }}-${{ steps.get_version.outputs.build_number }}"
          name: "Coconut Delivery v${{ steps.get_version.outputs.version }}-${{ steps.get_version.outputs.build_number }}"
          prerelease: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
