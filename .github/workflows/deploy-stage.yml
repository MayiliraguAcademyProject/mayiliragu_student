name: Firebase App Distribution (Staging)

on:
  push:
    branches:
      - stage
  pull_request:
    branches:
      - stage

jobs:
  build_and_distribute:
    name: Build and Distribute (Stage)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Increment Version in Pubspec
        id: get_version
        shell: pwsh
        run: |
          $content = Get-Content pubspec.yaml
          $line = $content | Select-String -Pattern "version: (.*)"
          $version = $line.Matches.Value.Split(" ")[1]
          $versionParts = $version.Split("+")
          $baseVersion = $versionParts[0]
          $buildNumber = [int]$versionParts[1] + 1
          $newVersion = "$baseVersion+$buildNumber"
          
          # Replace in file
          (Get-Content pubspec.yaml) -replace "version: .*", "version: $newVersion" | Set-Content pubspec.yaml
          
          echo "version=$baseVersion" >> $env:GITHUB_OUTPUT
          echo "build_number=$buildNumber" >> $env:GITHUB_OUTPUT
          echo "new_version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Commit version bump and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${{ steps.get_version.outputs.new_version }} (stage) [skip ci] [ci skip]"
          git tag "v${{ steps.get_version.outputs.version }}-${{ steps.get_version.outputs.build_number }}-stage"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
          git push origin "v${{ steps.get_version.outputs.version }}-${{ steps.get_version.outputs.build_number }}-stage"

      - name: Create Stage Environment
        run: |
          cat > .env.stage <<EOF
          BASE_URL=${{ secrets.BASE_URL_STAGE }}
          APP_NAME=Mayiliragu Stage
          ENABLE_LOGS=true
          EOF

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=.env.stage

      - name: Upload artifact to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: android
          file: build/app/outputs/flutter-apk/app-release.apk

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          tag_name: "v${{ steps.get_version.outputs.version }}-${{ steps.get_version.outputs.build_number }}-stage"
          name: "Coconut Delivery Stage v${{ steps.get_version.outputs.version }}-${{ steps.get_version.outputs.build_number }}"
          prerelease: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
